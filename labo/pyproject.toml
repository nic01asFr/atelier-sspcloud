[project]
name = "laboratoire"
version = "0.1.0"
description = "Laboratoire d'essais pour projets d'apprentissage automatique : données, méthodes, expériences, mesure honnête"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Les familles de modèles s'installent à part : le laboratoire se teste sans GPU.
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laboratoire = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
