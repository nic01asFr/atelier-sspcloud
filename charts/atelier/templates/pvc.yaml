{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "atelier.fullname" . }}
  labels:
    {{- include "atelier.labels" . | nindent 4 }}
  # Le volume porte les projets, les conversations et les secrets : un
  # `helm uninstall` ne l'emporte pas. Pour le supprimer vraiment :
  # kubectl delete pvc, à dessein.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
