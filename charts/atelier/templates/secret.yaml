{{/*
Les secrets de l'Atelier, posés dès `helm install` : la clé owner et la clé
du modèle. Le pod les lit par l'environnement et les écrit une fois sur son
volume (install/atelier-init.sh) ; le Secret survit à un `helm uninstall`
(resource-policy keep), comme le volume, pour qu'une réinstallation retrouve
la même clé.

La clé owner : fournie (`security.ownerKey`), elle est visible dans Onyxia
> Mes services et dans les notes ; sinon elle est tirée au sort une fois, et
`lookup` évite de la retirer à chaque `helm upgrade`.
*/}}
{{- $fournie := (.Values.security).ownerKey | default "" | trim }}
{{- $existant := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "atelier.fullname" .)) }}
{{- $owner := $fournie }}
{{- if not $owner }}
{{- if $existant }}
{{- $owner = index $existant.data "ATELIER_OWNER_KEY" | b64dec }}
{{- else }}
{{- $owner = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atelier.fullname" . }}-secrets
  labels:
    {{- include "atelier.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  ATELIER_OWNER_KEY: {{ $owner | quote }}
  ATELIER_LLM_API_KEY: {{ include "atelier.llm.apiKey" . | quote }}
  ATELIER_GITHUB_TOKEN: {{ (.Values.git).token | default "" | quote }}
