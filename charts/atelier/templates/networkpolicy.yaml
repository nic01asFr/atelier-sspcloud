{{- if .Values.security.networkPolicy.enabled }}
{{/*
Seuls les contrôleurs d'ingress du cluster atteignent le pod : un autre pod
du cluster ne parle pas à l'Atelier directement. Même liste que les autres
services du catalogue.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atelier.fullname" . }}
  labels:
    {{- include "atelier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atelier.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.security.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        {{- if (.Values.apps).enabled }}
        - protocol: TCP
          port: {{ .Values.apps.port }}
        {{- end }}
{{- end }}
