apiVersion: v1
kind: Service
metadata:
  name: {{ include "atelier.fullname" . }}
  labels:
    {{- include "atelier.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if (.Values.apps).enabled }}
    # L'hôte des applications : même processus, seconde application ASGI.
    - port: {{ .Values.apps.port }}
      targetPort: apps
      protocol: TCP
      name: apps
    {{- end }}
  selector:
    {{- include "atelier.selectorLabels" . | nindent 4 }}
