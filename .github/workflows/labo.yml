name: Laboratoire d'essais

on:
  push:
    branches: [main]
    paths:
      - "labo/**"
      - ".github/workflows/labo.yml"
  pull_request:
    paths:
      - "labo/**"
      - ".github/workflows/labo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e "./labo[dev]"
      - name: Suite (les tests dans un navigateur sont sautés sans Chromium)
        working-directory: labo
        run: python -m pytest -q
