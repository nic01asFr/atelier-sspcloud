name: Image de l'Atelier

on:
  push:
    branches: [main]
    paths:
      - "atelier-src/**"
      - "install/atelier-init.sh"
      - "deploy/Dockerfile"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "atelier-src/**"
      - "install/**"
      - "charts/**"
      - "deploy/Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

# Par défaut, lecture seule ; seul le pas qui pousse l'image demande plus.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/nic01asfr/atelier

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e "./atelier-src[dev]"
      - name: Suite
        working-directory: atelier-src
        run: python -m pytest -q

  image:
    needs: tests
    # Les étiquettes `latest` et `main` ne viennent que de main : lancé à la
    # main sur une autre branche, ou pour une demande de fusion, le workflow ne
    # fait que les tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Seule l'étiquette du commit part d'abord : `latest` est tirée à chaque
      # démarrage de pod, une image cassée ne doit jamais l'être avant sa fumée.
      - name: Construire et pousser (étiquette du commit)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
      # Docker ne lance pas le code : un import cassé passerait le build et
      # tomberait au premier démarrage de pod.
      - name: Fumée
        run: |
          docker run --rm --entrypoint python3 ${{ env.IMAGE }}:${{ github.sha }} \
            -c "import mcp_gateway.atelier.app; print('import ok')"
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:${{ github.sha }} \
            -c 'test ! -d /opt/atelier/extensions && ! command -v google-chrome >/dev/null && /opt/atelier/outils/node-*/bin/node --version && /opt/atelier/outils/code-server-*/bin/code-server --version && test -f /opt/atelier/wikichat/server.mjs && echo image redistribuable ok'
      # Seulement si la fumée est passée : la même image reçoit ses étiquettes
      # courantes, sans être reconstruite.
      - name: Étiqueter latest et main
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            --tag ${{ env.IMAGE }}:main \
            ${{ env.IMAGE }}:${{ github.sha }}
