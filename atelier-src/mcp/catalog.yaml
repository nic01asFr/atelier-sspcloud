# Catalogue minimal pod Atelier — services org ajoutés via sync ultérieur.
version: 1
enforce_envelope: false
default_bundle: tout
mcp_default_bundle: tout
bundles:
  tout:
    label: Connecteurs du pod
    description: Connecteurs personnels et méta-outils gateway.
    audience: catalog
    servers: []
    registry_servers: []
    meta_tools:
      - gateway_status
      - gateway_list_bundles
      - gateway_use_bundle
      - gateway_find_tools
      - gateway_call_tool
servers: {}
