[project]
name = "mcp-gateway-atelier"
version = "0.2.0"
description = "Atelier hub with integrated MCP gateway pool"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  # Les artefacts Markdown arrivent rendus en HTML ; sans lui, en texte brut.
  "mistune>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_gateway*"]

[project.scripts]
atelier = "mcp_gateway.atelier.app:main"

[project.optional-dependencies]
# De quoi lancer la suite : `pip install -e ".[dev]"` puis `pytest`.
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests importent le paquet depuis l'arbre, sans installation préalable.
pythonpath = ["."]
