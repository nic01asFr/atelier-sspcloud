[project]
name = "mcp-gateway-atelier"
dynamic = ["version"]
description = "Atelier : Claude Code sur un pod SSPCloud, avec ses projets, ses connecteurs et VS Code"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  # Les artefacts Markdown arrivent rendus en HTML ; sans lui, en texte brut.
  "mistune>=3.0",
]

[project.urls]
Homepage = "https://nic01asfr.github.io/atelier-sspcloud/"
Source = "https://github.com/nic01asFr/atelier-sspcloud"
Documentation = "https://github.com/nic01asFr/atelier-sspcloud/blob/main/docs/README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Une seule source de vérité pour la version : mcp_gateway/atelier/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "mcp_gateway.atelier.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_gateway*"]

# Des fichiers que le code lit à l'exécution : ils suivent le paquet même
# installé autrement qu'en mode éditable.
[tool.setuptools.package-data]
"mcp_gateway.atelier" = ["consignes/*.md"]
"mcp_gateway.gardiens" = ["gardiens.json"]

[project.scripts]
atelier = "mcp_gateway.atelier.app:main"

[project.optional-dependencies]
# De quoi lancer la suite : `pip install -e ".[dev]"` puis `pytest`.
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests importent le paquet depuis l'arbre, sans installation préalable.
pythonpath = ["."]
