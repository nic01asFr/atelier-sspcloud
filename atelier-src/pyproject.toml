[project]
name = "mcp-gateway-atelier"
version = "0.2.0"
description = "Atelier hub with integrated MCP gateway pool"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_gateway*"]

[project.scripts]
atelier = "mcp_gateway.atelier.app:main"
